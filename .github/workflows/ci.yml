name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    # The API test suite runs against a real Postgres rather than a mocked Prisma client: the
    # invariants worth testing (transactional points, the partial unique index on active
    # registration codes) only exist in the database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tennisladder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The root postinstall builds @tennisladder/shared, which api and web both import as a real
      # package — without it neither typechecks.
      - run: npm ci

      # Prisma's generated client is a typecheck dependency for the API.
      - run: npx prisma generate --schema api/prisma/schema.prisma

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tennisladder_test?schema=public

      - name: Build web
        run: npm run build --workspace=@tennisladder/web
        env:
          VITE_API_BASE_URL: https://example.invalid/api

      - name: Build API container image
        run: docker build -f api/Dockerfile .
