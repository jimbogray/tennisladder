name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Federated (OIDC) sign-in to Azure — no long-lived credentials stored in GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Migrations run first and gate everything else: if a migration fails, no new code ships.
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # GitHub runners have no fixed egress IP, so the Postgres firewall is opened just for this
      # run and closed again below, even if the migration fails.
      - name: Open Postgres firewall for this runner
        id: firewall
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org)
          echo "rule-name=gh-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.POSTGRES_SERVER_NAME }}" \
            --rule-name "gh-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Apply migrations
        run: npx prisma migrate deploy --schema api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Close Postgres firewall
        if: always() && steps.firewall.outputs.rule-name != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.POSTGRES_SERVER_NAME }}" \
            --rule-name "${{ steps.firewall.outputs.rule-name }}" \
            --yes --output none

  api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # az acr build builds inside Azure, so the runner needs no Docker setup or registry login.
      - name: Build and push image
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "tennisladder-api:${{ github.sha }}" \
            --image "tennisladder-api:latest" \
            --file api/Dockerfile .

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/tennisladder-api:${{ github.sha }}" \
            --output none

      - name: Smoke check
        run: |
          for attempt in $(seq 1 10); do
            if curl -sf "${{ vars.API_BASE_URL }}/health" | grep -q '"ok"'; then
              echo "API healthy"; exit 0
            fi
            echo "attempt $attempt: not healthy yet"; sleep 10
          done
          echo "API did not become healthy"; exit 1

  web:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite inlines env vars at build time, so the API URL and Maps key are baked in here rather
      # than configured on the Static Web App afterwards.
      - name: Build web
        run: npm run build --workspace=@tennisladder/web
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
