name: Deploy staging

# Every merge to main builds the API image once and deploys it to staging. Production later
# promotes that same image — see deploy-production.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # federated (OIDC) sign-in to Azure
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Builds run under the staging identity, which is the one allowed to push to the registry.
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # az acr build builds inside Azure, so the runner needs no Docker setup or registry login.
      # Tagged with the commit SHA so production can later deploy exactly this image.
      - name: Build and push API image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          SHA: ${{ github.sha }}
        run: |
          az acr build --registry "$ACR_NAME" \
            --image "tennisladder-api:$SHA" \
            --file api/Dockerfile .

  deploy:
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      sha: ${{ github.sha }}
    secrets: inherit
