name: Deploy production

# Production is never deployed straight from a merge. Running this workflow is the release
# decision: it promotes a commit that has already deployed successfully to staging, using the image
# built for staging rather than rebuilding it.
#
#   gh workflow run deploy-production.yml                 # latest successful staging deploy
#   gh workflow run deploy-production.yml -f sha=<commit> # a specific earlier one
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to promote. Leave blank for the most recent successful staging deploy.
        required: false
        type: string

permissions:
  id-token: write # federated (OIDC) sign-in to Azure
  contents: read
  actions: read # to confirm the commit passed staging

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick a commit that passed staging
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.sha }}
        run: |
          if [ -n "$REQUESTED" ]; then
            # Accept short SHAs by expanding them against the repo history.
            sha=$(git rev-parse --verify "${REQUESTED}^{commit}") ||
              { echo "::error::'$REQUESTED' is not a commit in this repository"; exit 1; }
          else
            sha=$(gh run list --workflow deploy-staging.yml --branch main --status success \
              --limit 1 --json headSha --jq '.[0].headSha')
            [ -n "$sha" ] || { echo "::error::no successful staging deploy found"; exit 1; }
          fi

          passed=$(gh run list --workflow deploy-staging.yml --commit "$sha" --status success \
            --json databaseId --jq 'length')
          if [ "$passed" = "0" ]; then
            echo "::error::$sha has not deployed successfully to staging, so it can't be promoted"
            exit 1
          fi

          echo "Promoting $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit
